schema_version: "0.1"
profile:
  id: minimal_release
  revision: 1
initial_state: prepared
states:
  - id: prepared
    kind: active
  - id: completed
    kind: terminal
transitions:
  - id: finish
    from: prepared
    to: completed
    guard_refs:
      - approval
      - published
    authority:
      - threadloop
      - human
    priority: 0
  - id: repeat
    from: prepared
    to: prepared
    priority: 1
    guard_refs: []
    authority:
      - threadloop
  - id: unlisted_loop
    from: prepared
    to: prepared
    priority: 2
    guard_refs: []
    authority:
      - threadloop
guards:
  - id: approval
    capability: human_approval
    parameters:
      scope: current_subject
    required_actions:
      - approve
  - id: published
    capability: completion_observed
    parameters:
      kind: publication
required_actions:
  - id: approve
    capability: approve_change
    authority: human
    parameters: {}
cycle_controls:
  - id: finish_route
    kind: terminal_route
    transition_refs:
      - repeat
    exit_transition_refs:
      - finish
