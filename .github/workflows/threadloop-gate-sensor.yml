name: ThreadLoop signed gate sensor

on:
  workflow_call:
    inputs:
      session_id:
        description: ThreadLoop session id
        required: true
        type: string
      plan_sha256:
        description: Canonical v2 proof-plan digest
        required: true
        type: string
      gate_id:
        description: Declared gate id
        required: true
        type: string
      gate_json:
        description: Canonical declared gate JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-gate:
    name: Signed gate / ${{ inputs.gate_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out pinned ThreadLoop sensor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: threadloop-sensor
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: threadloop-sensor/package-lock.json

      - name: Install pinned sensor dependencies
        run: npm ci --ignore-scripts
        working-directory: threadloop-sensor

      - name: Execute and sign declared gate
        run: npm run sensor:ci-gate
        working-directory: threadloop-sensor
        env:
          THREADLOOP_SESSION_ID: ${{ inputs.session_id }}
          THREADLOOP_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          THREADLOOP_GATE_ID: ${{ inputs.gate_id }}
          THREADLOOP_GATE_JSON: ${{ inputs.gate_json }}
          THREADLOOP_SOURCE_ROOT: ${{ github.workspace }}/source
          THREADLOOP_OUTPUT_PATH: ${{ github.workspace }}/receipt-output/signed-receipt.json

      - name: Upload signed receipt
        if: ${{ always() && hashFiles('receipt-output/signed-receipt.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: threadloop-signed-receipt-${{ inputs.gate_id }}-${{ github.run_attempt }}
          path: receipt-output/signed-receipt.json
          if-no-files-found: error
          retention-days: 30
